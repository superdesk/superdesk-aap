name: "CI"

on:
  [push, pull_request]

jobs:
  server:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - run: |
          sudo apt-get update
          sudo apt-get -y install libxml2-dev libxmlsec1-dev libexempi-dev unixodbc unixodbc-dev
      - run: docker compose -f ../.github/docker-compose.yml up -d
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('server/dev-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip
            ${{ runner.os }}-
      - run: |
          python -m pip install -U pip wheel setuptools
          pip install -r dev-requirements.txt
      - run: python manage.py app:initialize_data
      - run: python manage.py users:create -u test -p test -e test@localhost --admin
      - run: nosetests
      - run: behave ./features/ --format progress2 --logging-level ERROR

  client:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm
            ${{ runner.os }}-
      - run: git config --global url."https://git@".insteadOf git://
      - run: npm install --no-audit
      - run: npm run build
